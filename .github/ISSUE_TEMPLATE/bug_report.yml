name: Bug report
description: Something fails, answers look wrong, or a model shows "MLX" instead of "Optimized".
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Run `verdict diagnose` and paste its output below (`verdict diagnose --load` if no model is loaded; it loads Laya English). It contains no judged items, only your chip, macOS, versions and timings on built-in text. The link it prints opens this form with the fields filled in.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you did, what you expected and what you saw, with the exact error text.
    validations:
      required: true
  - type: textarea
    id: diagnose
    attributes:
      label: verdict diagnose output
      render: text
    validations:
      required: true
  - type: input
    id: chip
    attributes:
      label: Chip
      placeholder: M2 Pro, Mac14,12
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS
      placeholder: "15.5"
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Verdict version
      description: "`verdict --version`"
  - type: textarea
    id: reproduce
    attributes:
      label: How to reproduce
      description: A request or command that shows it, with sample text you are happy to share publicly.
